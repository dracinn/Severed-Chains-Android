    // Default to the disk-backed unpacker on Android: the in-memory path
    // needs more heap than ART typically grants, and the native OOM abort
    // fires before upstream's OutOfMemoryError fallback can save the flag.
    'return readBool("low_memory_unpacker", false);':
    'return readBool("low_memory_unpacker", true);',
  ],
  'legend/game/unpacker/FileBackedFileData.java': [
    // getBytes() materializes the whole backing file in heap — several
    // hundred MB for STR video files, times executor threads -> OOM.
    // Stream in chunks instead; identical bytes written.
    '''  @Override
