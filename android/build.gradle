    synchronized(this.file) {
      this.file.seek(this.offset);
      final byte[] chunk = new byte[Math.min(this.size, 1 << 20)];
      int remaining = this.size;

      while(remaining > 0) {
        final int read = this.file.read(chunk, 0, Math.min(chunk.length, remaining));
        if(read < 0) {
          break;
        }

        out.write(chunk, 0, read);
        remaining -= read;
      }
