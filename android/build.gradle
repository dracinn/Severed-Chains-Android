tasks.register('patchStagedSources') {
  dependsOn 'stageSharedSources'
  doLast {
    final File root = layout.buildDirectory.dir('shared-sources').get().asFile
    root.eachFileRecurse { f ->
      if(!f.isFile() || !f.name.endsWith('.java')) {
        return
      }

      final String rel = root.toPath().relativize(f.toPath()).toString()
      String text = f.getText('UTF-8')
      final String original = text

      sharedLiteralTransforms[rel]?.each { literal, replacement ->
        // Idempotency first: additive transforms keep the needle inside the
        // replacement (e.g. Resolution rungs), so check the replacement is
        // absent before matching the needle, or re-runs double-apply.
        if(text.contains(replacement) || text.contains(replacement.replace('\n', '\r\n'))) {
          return // already transformed by a previous run
        }
        // Upstream files mix LF and CRLF; match either newline style and
        // preserve the file's own style in the replacement.
        String needle = literal
        if(!text.contains(needle)) {
          needle = literal.replace('\n', '\r\n')
          if(!text.contains(needle)) {
            throw new GradleException("Staged-source transform missed ${rel}: '${literal}' (upstream changed; update sharedLiteralTransforms)")
          }
        }
        text = text.replace(needle, needle.contains('\r\n') ? replacement.replace('\n', '\r\n') : replacement)
      }

      sharedRegexTransforms.each { pattern, replacement ->
        text = text.replaceAll(pattern, replacement)
      }

      if(text != original) {
        f.setText(text, 'UTF-8')
      }
    }
  }
}

// Native third-party sources (libogg/opus/opusfile) for the JNI opus bridge.
// Tarballs are downloaded from downloads.xiph.org and verified against the
// SHA-256 checksums published in the official SHA256SUMS files there.
def thirdPartyDownloads = [
  'libogg-1.3.5': [
    'https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz',
    '0eb4b4b9420a0f51db142ba3f9c64b333f826532dc0f48c6410ae51f4799b664',
  ],
  'opus-1.5.2': [
    'https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz',
    '65c1d2f78b9f2fb20082c38cbe47c951ad5839345876e46941612ee87f9a7ce1',
  ],
  'opusfile-0.12': [
    'https://downloads.xiph.org/releases/opus/opusfile-0.12.tar.gz',
    '118d8601c12dd6a44f52423e68ca9083cc9f2bfe72da7a8c1acb22a80ae3550b',
  ],
]
def thirdPartyDir = layout.buildDirectory.dir('third_party')

tasks.register('fetchThirdParty') {
  def downloadsDir = thirdPartyDir.map { it.dir('downloads') }
  def srcDir = thirdPartyDir.map { it.dir('src') }
  outputs.dir srcDir
  doLast {
    final File dlDir = downloadsDir.get().asFile
    final File src = srcDir.get().asFile
    dlDir.mkdirs()
    src.mkdirs()
    thirdPartyDownloads.each { name, meta ->
      final String url = meta[0]
      final String expected = meta[1]
      final File tarball = new File(dlDir, "${name}.tar.gz")
      final File outDir = new File(src, name)

      if(!tarball.isFile()) {
        logger.lifecycle("Downloading ${url}")
        tarball.withOutputStream { it << new URL(url).openStream() }
      }

      final String actual = java.security.MessageDigest.getInstance('SHA-256')
        .digest(tarball.bytes).encodeHex().toString()
      if(actual != expected) {
        tarball.delete()
        throw new GradleException("SHA-256 mismatch for ${name}: got ${actual}, expected ${expected} (published in downloads.xiph.org SHA256SUMS); tarball deleted")
      }

      if(!outDir.isDirectory()) {
        final File tmp = new File(src, ".extract-${name}")
        tmp.mkdirs()
        ant.untar(src: tarball, dest: tmp, compression: 'gzip')
        final File[] roots = tmp.listFiles()
        if(roots.length != 1 || !roots[0].isDirectory()) {
          throw new GradleException("Unexpected tarball layout for ${name}")
        }
        if(!roots[0].renameTo(outDir)) {
          throw new GradleException("Failed to place extracted ${name}")
        }
        tmp.deleteDir()
      }
    }
  }
}

tasks.named('preBuild').configure {
  dependsOn 'patchStagedSources', 'fetchThirdParty'
}

tasks.matching { it.name.startsWith('externalNativeBuild') }.configureEach {
  dependsOn 'fetchThirdParty'
}

// Compile staged upstream sources + Android glue with the real JDK platform
// (--release 21), bypassing AGP's android.jar --system image.
def sharedClassesDir = layout.buildDirectory.dir('classes/shared')

def sdkDir = {
  // local.properties (sdk.dir) wins; CI sets ANDROID_HOME/ANDROID_SDK_ROOT
  // instead and has no local.properties — don't require the file to exist.
  def propsFile = rootProject.file('local.properties')
  if(propsFile.exists()) {
    def props = new Properties()
    propsFile.withInputStream { props.load(it) }
    if(props.getProperty('sdk.dir') != null) {
      return props.getProperty('sdk.dir')
    }
  }

  return System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT') ?: android.sdkDirectory.absolutePath
}
def androidJar = "${sdkDir()}/platforms/${android.compileSdkVersion}/android.jar"

tasks.register('compileShared', JavaCompile) {
  dependsOn 'patchStagedSources'
  source = fileTree('src/main/java') + fileTree(layout.buildDirectory.dir('shared-sources'))
  classpath = files(androidJar) + configurations.sharedDeps
  destinationDirectory = sharedClassesDir
  // -source/-target rather than --release: classpath mode lets our java.awt/
  // javax.imageio runtime stubs coexist with the JDK's java.desktop module.
  // Java 25: upstream uses flexible constructor bodies (JEP 513) and unnamed
  // lambda params; javac emits pre-super field stores, which ART accepts.
  sourceCompatibility = '25'
  targetCompatibility = '25'
  options.encoding = 'UTF-8'
  // patchStagedSources mutates sources in place after staging; incremental
  // analysis has missed those changes, shipping stale classes to dex.
  options.incremental = false
  // android.jar/java.* duplicates on the classpath are expected and harmless
  options.compilerArgs += ['-proc:none']
}

// Runtime classpath scanning (org.reflections) cannot work on Android dex.
// Index every staged class that uses a modloader annotation so the
// same-FQN org.reflections replacement can serve getTypesAnnotatedWith.
// FQN = file path relative to the staged root (modloader annotations are
// only used on top-level classes and their members upstream).
def annotationIndexDir = layout.buildDirectory.dir('generated/annotation-index')

tasks.register('generateAnnotationIndex') {
  dependsOn 'stageSharedSources'
  def sharedSources = layout.buildDirectory.dir('shared-sources')
  inputs.dir sharedSources
  def indexFile = annotationIndexDir.map { it.file('META-INF/sc/annotation-index.txt') }
  outputs.file indexFile
  doLast {
    final File root = sharedSources.get().asFile
    final Set<String> lines = new TreeSet<>()
    root.eachFileRecurse { f ->
      if(!f.name.endsWith('.java')) {
        return
      }
      final String text = f.getText('UTF-8')
      text.eachMatch(/import (org\.legendofdragoon\.modloader(?:\.[\w]+)*\.(\w+));/) { match ->
        final String annotationFqn = match[1]
        final String simpleName = match[2]
        if(text =~ /@\Q${simpleName}\E\b/) {
          final String classFqn = root.toPath().relativize(f.toPath()).toString().replace(File.separatorChar, '.' as char) - '.java'
          lines.add("${annotationFqn}:${classFqn}".toString())
        }
      }
    }
    final File out = indexFile.get().asFile
    out.parentFile.mkdirs()
    out.setText(lines.join('\n') + '\n', 'UTF-8')
    logger.lifecycle("Annotation index: {} entries", lines.size())
  }
}

tasks.register('packageSharedClasses', Jar) {
  dependsOn 'compileShared', 'generateAnnotationIndex'
  from sharedClassesDir
  // Upstream classpath resources (mod lang files, etc.) must ride along:
  // mergeDebugJavaResource puts them at APK root where getResource finds them
  from('../src/main/resources') {
    filesMatching('lod_core/lang/en.lang') {
      // Labels for the Resolution enum rungs added by the staged-source
      // transform (960/1200/1680/1920/2400/2880). Filter is per line.
      filter { line ->
        if(line == 'lod_core.config.resolution._720=720p') {
          return line + '\nlod_core.config.resolution._960=960p'
        }
        if(line == 'lod_core.config.resolution._1080=1080p') {
          return line + '\nlod_core.config.resolution._1200=1200p'
        }
        if(line == 'lod_core.config.resolution._1440=1440p') {
          return line + '\nlod_core.config.resolution._1680=1680p\nlod_core.config.resolution._1920=1920p'
        }
        if(line == 'lod_core.config.resolution._4K=4K') {
          return line + '\nlod_core.config.resolution._2400=2400p\nlod_core.config.resolution._2880=2880p'
        }
        return line
      }
    }
  }
  from '../third_party/sc-dragoon-modifier/src/main/resources'
  // Main.main points log4j2.configurationFile at the relative "log4j2.xml";
  // it does not exist on device, so log4j falls back to a classpath lookup
  from('../log4j2.xml') {
    filter { it.replace('fileName="debug.log"', 'fileName="${sys:legend.baseDir}/debug.log"') }
  }
  doLast {
    final File packed = zipTree(layout.buildDirectory.file('libs/shared-classes.jar').get().asFile)
      .matching { include 'log4j2.xml' }.singleFile
    if(!packed.text.contains('${sys:legend.baseDir}/debug.log')) {
      throw new GradleException('log4j2.xml no longer contains fileName="debug.log"; update the Android rewrite')
    }

    final File lang = zipTree(layout.buildDirectory.file('libs/shared-classes.jar').get().asFile)
      .matching { include 'lod_core/lang/en.lang' }.singleFile
    if(!lang.text.contains('lod_core.config.resolution._2880=')) {
      throw new GradleException('Resolution lang labels missing: upstream en.lang changed; update packageSharedClasses')
    }
  }
  from annotationIndexDir
  destinationDirectory = layout.buildDirectory.dir('libs')
  archiveFileName = 'shared-classes.jar'
}

tasks.named('preBuild').configure {
  dependsOn 'packageSharedClasses', 'patchDependencyJars'
}

configurations {
  // Shared between compileShared (javac classpath) and AGP (implementation),
  // so both see exactly the same third-party jars.
  sharedDeps {
    // LWJGL native bindings are unusable on Android; org.lwjgl.* shims in
    // android/src/main/java replace them (also avoids natives META-INF dupes)
    exclude group: 'org.lwjgl'
    // Runtime bytecode scanning cannot work on dex; same-FQN org.reflections.*
    // replacements serve a build-time annotation index instead (see
    // generateAnnotationIndex). Only mod-loader uses this library.
    exclude group: 'org.reflections'
  }
  implementation.extendsFrom sharedDeps
  transpile
  jarPatch
}

// Stock dep jars are resolved only to feed JarPatcher; sharedDeps consumes
// the patched outputs plus their transitives declared explicitly.
def unpatchedDeps = [
  'mod-loader.jar': configurations.detachedConfiguration(
      dependencies.create('org.legendofdragoon:mod-loader:4.3.4')),
  'script-recompiler.jar': configurations.detachedConfiguration(
      dependencies.create('org.legendofdragoon:script-recompiler:0.7.11')),
]
unpatchedDeps.each { _, conf -> conf.transitive = false }

def patchedDepsDir = layout.buildDirectory.dir('patched-deps')
def patchedModLoaderJar = patchedDepsDir.map { it.file('mod-loader.jar') }
def patchedScriptRecompilerJar = patchedDepsDir.map { it.file('script-recompiler.jar') }

tasks.register('compileJarPatcher', JavaCompile) {
  source = fileTree('tools') { include 'JarPatcher.java' }
  classpath = configurations.jarPatch
  destinationDirectory = layout.buildDirectory.dir('jar-patcher/classes')
  sourceCompatibility = '17'
  targetCompatibility = '17'
}

def patchTasks = unpatchedDeps.collect { name, conf ->
  tasks.register("patchDep_${name - '.jar'}", JavaExec) {
    dependsOn 'compileJarPatcher'
    inputs.files conf
    outputs.file patchedDepsDir.map { it.file(name) }
    classpath = files(layout.buildDirectory.dir('jar-patcher/classes')) + configurations.jarPatch
    mainClass = 'JarPatcher'
    args conf.singleFile.absolutePath, patchedDepsDir.get().file(name).asFile.absolutePath
  }
}

tasks.register('patchDependencyJars') {
  dependsOn patchTasks
}

tasks.named('compileShared').configure {
  dependsOn 'patchDependencyJars'
}

dependencies {
  // Patched at build time by JarPatcher (see patchDependencyJars) to redirect
  // Method.canAccess / Class.getProtectionDomain onto JdkReflect helpers.
  sharedDeps files(patchedModLoaderJar)
  // mod-loader transitives (declared explicitly since the jar comes via files())
  sharedDeps 'org.apache.commons:commons-collections4:4.4'
  sharedDeps 'com.vdurmont:semver4j:3.1.0'
  sharedDeps 'org.fusesource.jansi:jansi:2.4.3'
  sharedDeps 'org.slf4j:slf4j-nop:2.0.7'
  sharedDeps files(patchedScriptRecompilerJar)
  // script-recompiler transitives (declared explicitly since the jar comes via files())
  sharedDeps 'org.antlr:antlr4:4.13.2'
  sharedDeps 'org.legendofdragoon:mogul-dabas:0.0.1'

  sharedDeps 'org.apache.logging.log4j:log4j-api:2.26.1'
  sharedDeps 'org.apache.logging.log4j:log4j-core:2.26.1'

  sharedDeps "org.joml:joml:1.10.8"

  sharedDeps 'org.json:json:20250107'
  sharedDeps 'com.google.code.gson:gson:2.13.2'

  sharedDeps 'com.opencsv:opencsv:5.9'
  sharedDeps 'io.github.java-diff-utils:java-diff-utils:4.15'
  sharedDeps 'commons-io:commons-io:2.18.0'

  sharedDeps 'com.github.slugify:slugify:3.0.7'
  sharedDeps 'it.unimi.dsi:fastutil:8.5.15'
  sharedDeps 'com.google.code.findbugs:jsr305:3.0.2'
  sharedDeps 'org.jspecify:jspecify:1.0.0'

  // Discord SDK data classes only (Activity type in updateDiscordRichPresence
  // signatures); natives are never loaded - DiscordRichPresence is stubbed.
  sharedDeps 'com.github.JnCrMx:discord-game-sdk4j:v1.0.0'

  implementation files(layout.buildDirectory.dir('libs').map { it.file('shared-classes.jar') })

  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'

  // Host-side shader transpiler (runs on the build JVM, not the device)
  transpile "org.lwjgl:lwjgl:$lwjglVersion"
  transpile "org.lwjgl:lwjgl:$lwjglVersion:$lwjglNatives"
  transpile "org.lwjgl:lwjgl-shaderc:$lwjglVersion"
  transpile "org.lwjgl:lwjgl-spvc:$lwjglVersion"
  transpile "org.lwjgl:lwjgl-shaderc:$lwjglVersion:$lwjglNatives"
  transpile "org.lwjgl:lwjgl-spvc:$lwjglVersion:$lwjglNatives"

  // Host-side bytecode patcher for dependency jars (JarPatcher.java)
  jarPatch 'org.ow2.asm:asm:9.8'
}

// Patch gfx/shaders for Android before staging/transpiling. Upstream files
// stay pristine; the staged copies feed both the asset extraction path and
// ShaderTranspiler, so the runtime content-hash lookup stays consistent.
def patchedShaders = layout.buildDirectory.dir('patched-gfx/shaders')

tasks.register('patchGfxShaders', Copy) {
  from('../gfx/shaders')
  into patchedShaders
  filesMatching('screen.fsh') {
    // Copy.filter is invoked per line, so match single lines only.
    filter { line ->
      // FSR1-RCAS-style sharpened upscale for the internal-resolution option.
      // Upstream presents the render buffer with a plain bilinear stretch;
      // this sharpens the result when (and only when) it is upscaling.
      if(line == 'void main() {') {
        return '''// Android: contrast-adaptive sharpened upscale. Neighbours are sampled one
// output texel away on the bilinear reconstruction, then the centre is
// unsharp-masked and clamped to the neighbourhood min/max (ringing guard).
vec3 casUpscale(sampler2D tex, vec2 uv) {
  vec2 srcTexel = 1.0 / vec2(textureSize(tex, 0));
  vec2 outTexel = fwidth(uv);

  // Native res or downsampling: the bilinear tap is already correct.
  if(outTexel.x >= srcTexel.x && outTexel.y >= srcTexel.y) {
    return texture(tex, uv).rgb;
  }

  vec3 c = texture(tex, uv).rgb;
  vec3 n = texture(tex, uv + vec2(0.0, outTexel.y)).rgb;
  vec3 s = texture(tex, uv - vec2(0.0, outTexel.y)).rgb;
  vec3 e = texture(tex, uv + vec2(outTexel.x, 0.0)).rgb;
  vec3 w = texture(tex, uv - vec2(outTexel.x, 0.0)).rgb;

  vec3 lo = min(c, min(min(n, s), min(e, w)));
  vec3 hi = max(c, max(max(n, s), max(e, w)));

  return clamp(c + (c - (n + s + e + w) * 0.25) * 0.5, lo, hi);
}

void main() {'''
      }
      if(line == '  frag = vec4(texture(screen, vertUv).rgb, 1.0f);') {
        return '  frag = vec4(casUpscale(screen, vertUv), 1.0f);'
      }
      return line
    }
  }
  filesMatching(['tmd.vsh', 'battle_tmd.vsh']) {
    // Copy.filter is invoked per line, so match single lines only.
    filter { line ->
      // ES 3.1 devices (Mali Midgard) have no geometry shader, so the
      // GS-linked program is skipped and tmd.gsh's near-plane face cull is
      // replicated here per vertex: the GS culls the whole face when any
      // vertex fails zfar >= viewspaceZ * 2.0, and a NaN clip position
      // discards the whole primitive — same all-or-nothing result. On the
      // ES 3.2 path this is a harmless duplicate of the GS's own test (the
      // quad fourth-vertex test still only exists in the GS).
      if(line == '  vs_out.depth = gl_Position.z;') {
        return '''  vs_out.depth = gl_Position.z;

  // Android: replicate tmd.gsh's near-plane face cull for the GS-less
  // ES 3.1 path — a NaN clip position kills the whole primitive.
  if(zfar >= vs_out.viewspaceZ * 2.0) {
    gl_Position = vec4(0.0 / 0.0);
  }'''
      }
      return line
    }
  }
  doLast {
    if(!new File(destinationDir, 'screen.fsh').text.contains('casUpscale')) {
      throw new GradleException('screen.fsh transform missed: upstream changed; update patchGfxShaders')
    }
    ['tmd.vsh', 'battle_tmd.vsh'].each {
      if(!new File(destinationDir, it).text.contains('0.0 / 0.0')) {
        throw new GradleException("${it} transform missed: upstream changed; update patchGfxShaders")
      }
    }
  }
}

// Stage upstream gfx/ as assets/gfx/ so MainActivity can extract it to the
// app's working directory, preserving upstream's Path.of("gfx/...") reads.
// Shaders come from the patched copies made by patchGfxShaders.
tasks.register('stageAssets', Copy) {
  dependsOn 'patchGfxShaders'
  from('../gfx') {
    into 'gfx'
    exclude 'shaders/**'
  }
  from(patchedShaders) {
    into 'gfx/shaders'
  }
  from('../lang') {
    into 'lang'
  }
  // Unpacker patch data (replacements, scripts, libs) read via Path.of
  from('../patches') {
    into 'patches'
  }
  // Built-in mod assets read via Path.of("mods/...") (Dragoon Modifier
  // stat tables/portraits); extracted to the working dir alongside gfx/.
  from('../third_party/sc-dragoon-modifier/mods') {
    into 'mods'
  }
  // Extracted to the working dir alongside gfx/ for the log4j config path
  from('../log4j2.xml') {
    filter { it.replace('fileName="debug.log"', 'fileName="${sys:legend.baseDir}/debug.log"') }
  }
  into layout.buildDirectory.dir('generated/assets')
  doLast {
    final File staged = new File(destinationDir, 'log4j2.xml')
    if(!staged.text.contains('${sys:legend.baseDir}/debug.log')) {
      throw new GradleException('log4j2.xml no longer contains fileName="debug.log"; update the Android rewrite')
    }
  }
}

// Transpile gfx/shaders/*.vsh/.gsh/.fsh to GLSL ES on the host JVM
// (mirrors upstream ShaderManager's shaderc->SPIRV-Cross pipeline).
def transpilerClasses = layout.buildDirectory.dir('transpiler/classes')

tasks.register('compileShaderTranspiler', JavaCompile) {
  source = files('tools/ShaderTranspiler.java')
  classpath = configurations.transpile
  destinationDirectory = transpilerClasses
  options.release = 17
}

tasks.register('transpileShaders', JavaExec) {
  dependsOn tasks.named('compileShaderTranspiler'), 'patchGfxShaders'
  inputs.dir patchedShaders
  outputs.dir layout.buildDirectory.dir('generated/assets/shaders')
  classpath = files(transpilerClasses) + configurations.transpile
  mainClass = 'ShaderTranspiler'
  doFirst {
    // Hash-named outputs; clear leftovers from older sources so the APK
    // never ships stale shader assets.
    delete layout.buildDirectory.dir('generated/assets/shaders')
  }
  args patchedShaders.get().asFile.absolutePath, layout.buildDirectory.dir('generated/assets/shaders').get().asFile.absolutePath
}

tasks.named('preBuild').configure {
  dependsOn 'stageSharedSources', 'stageAssets', 'transpileShaders'
}
