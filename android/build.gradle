plugins {
  id 'com.android.application' version '9.0.1'
}

repositories {
  google()
  mavenCentral()
  maven { url = "https://central.sonatype.com/repository/maven-snapshots/" }
  maven { url = "https://jitpack.io" }
}

def lwjglVersion = '3.4.3'
def osName = System.properties['os.name'].toLowerCase()
def isArm = System.properties['os.arch'] in ['aarch64', 'arm64']
def lwjglNatives = osName.contains('mac') ? (isArm ? 'natives-macos-arm64' : 'natives-macos')
                 : osName.contains('win') ? 'natives-windows'
                 : (isArm ? 'natives-linux-arm64' : 'natives-linux')

// Release version: CI injects ANDROID_VERSION_NAME with the tag (e.g. v0.1.2);
// locally we fall back to the latest git tag, then a dev default.
def buildVersionName = { ->
  final envName = System.getenv('ANDROID_VERSION_NAME')
  if(envName != null && !envName.isEmpty()) {
    return envName.replaceFirst('^v', '')
  }
  try {
    final proc = ['git', 'describe', '--tags', '--abbrev=0'].execute(null, rootDir)
    if(proc.waitFor() == 0) {
      return proc.text.trim().replaceFirst('^v', '')
    }
  } catch(final Exception ignored) {
  }
  return '1.0'
}()

// versionCode tracks the tag (0.1.2 -> 102) so upgrades always install; falls
// back to 4 to stay above the versionCode used by pre-tag releases.
def buildVersionCode = { ->
  final matcher = buildVersionName =~ /^(\d+)\.(\d+)\.(\d+)/
  return matcher.find()
    ? matcher.group(1).toInteger() * 10_000 + matcher.group(2).toInteger() * 100 + matcher.group(3).toInteger()
    : 4
}()

android {
  namespace = 'legend.game.android'
  compileSdk = 34

  defaultConfig {
    applicationId = 'com.legendofdragoon.severedchains'
    minSdk = 26
    targetSdk = 34
    versionCode = buildVersionCode
    versionName = buildVersionName

    ndk {
      abiFilters 'arm64-v8a', 'x86_64'
    }
  }

  ndkVersion = '25.2.9519653'

  signingConfigs {
    // CI injects SIGNING_* env vars (secrets -> decoded keystore path,
    // passwords, alias). Absent locally, where debug signing suffices and
    // assembleRelease produces an unsigned APK.
    release {
      if(System.getenv('SIGNING_KEYSTORE_PATH') != null) {
        storeFile file(System.getenv('SIGNING_KEYSTORE_PATH'))
        storePassword System.getenv('SIGNING_STORE_PASSWORD')
        keyAlias System.getenv('SIGNING_KEY_ALIAS')
        keyPassword System.getenv('SIGNING_KEY_PASSWORD')
      }
    }
  }

  buildTypes {
    release {
      if(System.getenv('SIGNING_KEYSTORE_PATH') != null) {
        signingConfig = signingConfigs.release
      }
    }
  }

  externalNativeBuild {
    cmake {
      path file('src/main/cpp/CMakeLists.txt')
    }
  }

  buildFeatures {
    buildConfig = true
  }

  packaging {
    resources {
      excludes += [
        'META-INF/DEPENDENCIES',
        'META-INF/LICENSE',
        'META-INF/LICENSE.txt',
        'META-INF/NOTICE',
        'META-INF/NOTICE.txt',
        'META-INF/*.SF',
        'META-INF/*.RSA',
        'META-INF/*.DSA',
        'META-INF/versions/9/module-info.class',
        'module-info.class',
        'META-INF/*.kotlin_module',
      ]
      // Both log4j jars ship this plugin descriptor; the core one carries the
      // real plugin registry
      pickFirsts += 'META-INF/org/apache/logging/log4j/core/config/plugins/Log4j2Plugins.dat'
    }
  }

  compileOptions {
    // Inert for sources: AGP's javac compiles nothing (java.srcDirs = []); the
    // real language level is compileShared's (Java 25, same as desktop).
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    // Java 21 library APIs (Math.clamp, SequencedCollection, java.nio.file)
    // are rewritten for Android by desugar_jdk_libs_nio.
    coreLibraryDesugaringEnabled = true
  }

  sourceSets {
    main {
      // All Java sources (staged upstream + Android glue) are compiled by the
      // compileShared task into shared-classes.jar, which AGP consumes as an
      // implementation dependency. AGP's own javac would pin --system to the
      // android.jar java.* subset, which is missing JDK APIs upstream needs.
      java.srcDirs = []
      // Upstream resources ride along inside shared-classes.jar
      // (packageSharedClasses); adding them here too makes every entry a
      // duplicate in mergeJavaRes.
      manifest.srcFile 'src/main/AndroidManifest.xml'
      assets.srcDirs += "$buildDir/generated/assets".toString()
    }
  }
}

// Stage upstream sources minus the desktop-only files that are replaced by
// same-FQN Android variants (android/src/main/java) or unused on device.
def sharedSourceExcludes = [
  'discord/DiscordRichPresence.java',
  'legend/core/platform/SdlPlatformManager.java',
  'legend/core/platform/SdlWindow.java',
  'legend/core/platform/SdlInput.java',
  'legend/core/platform/input/SdlGamepadDevice.java',
  'legend/core/renderer/opengl/**',
  'legend/core/renderer/ShaderManager.java',
  'legend/core/Updater.java',
  'legend/core/UpdaterApplication.java',
  'legend/core/UpdaterController.java',
  'legend/core/UpdaterMain.java',
  'legend/core/SelfUpdater.java',
  'legend/game/debugger/**',
  'legend/game/MainWindows.java',
  'legend/core/audio/SoundTest.java',
  // Dev-only javax.sound tool, unused by the unpacker pipeline
  'legend/game/unpacker/midi/SoundbankDecoder.java',
]

tasks.register('stageSharedSources', Sync) {
  from '../src/main/java'
  // Vendored upstream mods (third_party/; update with
  // `git subtree pull --prefix=third_party/<dir> <repo> main --squash`)
  from '../third_party/sc-dragoon-modifier/src/main/java'
  into layout.buildDirectory.dir('shared-sources')
  sharedSourceExcludes.each { exclude it }
}

// ---------------------------------------------------------------------------
// JDK API compatibility
//
// AGP 9 pins its javac --system to a generated image exposing only the
// android.jar java.* subset, which lacks APIs upstream uses (String.formatted,
// List.getFirst, Files.readString, Math.clamp, virtual threads, ...). Instead
// of fighting that image, all Java code is compiled by compileShared (plain
// javac, -source/-target 25, full JDK platform) and packaged into
// shared-classes.jar, which AGP dexes as an implementation dependency.
//
// At runtime, coreLibraryDesugaring rewrites covered calls (formatted,
// getFirst/Last/addFirst, readString/writeString, resultNow, ...). APIs it
// does not cover (Math.clamp, virtual threads, bounded Random.nextFloat,
// absolute bulk Buffer get/put, Math.TAU, Locale.of, JSONObject.keySet) are
// rewritten to legend.game.android.JdkCompat by patchStagedSources below, so
// the upstream files stay byte-identical and merges keep flowing through.
// ---------------------------------------------------------------------------

// Regexes applied to every staged upstream line.
def sharedRegexTransforms = [
  // Both `Math.clamp` and `java.lang.Math.clamp` spellings occur upstream
  [~/java\.lang\.Math\.clamp\(/, 'legend.game.android.JdkCompat.clamp('],
  [~/(?<![\w.])Math\.clamp\(/, 'legend.game.android.JdkCompat.clamp('],
  [~/java\.lang\.Math\.TAU\b/, 'legend.game.android.JdkCompat.TAU'],
  [~/(?<![\w.])Math\.TAU\b/, 'legend.game.android.JdkCompat.TAU'],
  // X.nextFloat(bound) / nextFloat(origin, bound) - RandomGenerator defaults;
  // the lookbehind keeps re-runs from re-matching JdkCompat.nextFloat
  [~/([\w.]+)(?<!JdkCompat)\.nextFloat\((?!\s*\))/, 'legend.game.android.JdkCompat.nextFloat($1, '],
  // Locale.of(lang[, country]) == new Locale(...) for our purposes
  [~/(?<![\w.])Locale\.of\(/, 'new Locale('],
  // No virtual threads on Android; the executor type must also change because
  // Android's ExecutorService is not AutoCloseable (try-with-resources)
  [~/ExecutorService (\w+) = Executors\.newVirtualThreadPerTaskExecutor\(\)/,
   'legend.game.android.JdkCompat.CloseableExecutor $1 = legend.game.android.JdkCompat.newVirtualThreadPerTaskExecutor()'],
]

// Exact call-site rewrites for the post-Java-8 absolute bulk Buffer
// get/put overloads, keyed by staged path. A literal that stops matching
// (upstream edit) fails the build so it can't silently regress.
def sharedLiteralTransforms = [
