// ------------------------------------------------------------------
// .app bundle (jpackage) + signing
// ------------------------------------------------------------------
// Stages the dist layout (macos jar + libs/ + game data) as Contents/app,
// embeds a full JDK 25 runtime, and produces a signed
// macos/build/dist/Severed Chains.app. BundleMain (the main class) links
// isos/saves/mods/files/config into ~/Documents/Severed Chains and, when
// the bundled ANGLE libs are present, AngleContext renders GLES-over-Metal.
//
// JDK override:    -PjpackageHome=<jdk home> or $JPACKAGE_HOME.
// App version:     -PmacAppVersion=x.y.z
// ANGLE libs:      -PangleLibsDir=<dir> (default: Android emulator's
//                  gles_angle; skipped if missing → plain OpenGL build)
// Signing:         -PmacSignIdentity=<identity> (default: Developer ID
//                  Application cert in keychain; skipped if absent)

def macJdkHome = providers.gradleProperty('jpackageHome')
  .orElse(providers.environmentVariable('JPACKAGE_HOME'))
  .orElse('/opt/homebrew/opt/openjdk@25/libexec/openjdk.jdk/Contents/Home')
def macSignIdentity = providers.gradleProperty('macSignIdentity')
  .orElse('Developer ID Application: William Harrison (25TXA8VF4A)')
def angleLibsDir = providers.gradleProperty('angleLibsDir')
  .orElse(providers.provider {
    // Prefer the source-built ANGLE; fall back to the emulator's copy.
    ['/Volumes/Storage/angle-build/out/Release',
     "${System.getProperty('user.home')}/Library/Android/sdk/emulator/lib64/gles_angle",
     System.getenv('ANDROID_SDK_ROOT') ? "${System.getenv('ANDROID_SDK_ROOT')}/emulator/lib64/gles_angle" : null,
     System.getenv('ANDROID_HOME') ? "${System.getenv('ANDROID_HOME')}/emulator/lib64/gles_angle" : null,
    ].find { it != null && file("$it/libGLESv2.dylib").isFile() }
  })

// Upstream log4j2.xml, rewritten for the bundle — mirrors the Android rewrite:
// debug.log goes to the external data dir via ${sys:legend.baseDir} (GameLog
// sets it), and the console appender only passes warnings and errors. The
// full log stays in debug.log, whose tail GameLog appends to crash logs.
def log4jConsoleFilter = '<ThresholdFilter level="warn" onMatch="NEUTRAL" onMismatch="DENY"/>'
def rewriteLog4jLine = { String line ->
  line
    .replace('fileName="debug.log"', 'fileName="${sys:legend.baseDir}/debug.log"')
    .replace('<Console name="console" target="SYSTEM_OUT">', '<Console name="console" target="SYSTEM_OUT">' + log4jConsoleFilter)
}
def checkLog4jConfig = { File config ->
  if(!config.text.contains('${sys:legend.baseDir}/debug.log')) {
    throw new GradleException('log4j2.xml no longer contains fileName="debug.log"; update the macOS rewrite')
  }
  if(!config.text.contains(log4jConsoleFilter)) {
    throw new GradleException('log4j2.xml no longer contains the "console" appender; update the macOS rewrite')
  }
}
def macAppInput = layout.buildDirectory.dir('macapp/input')
def macAppIcon = layout.buildDirectory.file('macapp/SeveredChains.icns')
def macEntitlements = layout.buildDirectory.file('macapp/entitlements.plist')
def macDistDir = layout.buildDirectory.dir('dist')

tasks.register('appInput', Copy) {
  dependsOn 'jar', ':copyLibs', ':generateCopyrightFont'
  doFirst {
    // A read-only staged file (brew ships libMoltenVK.dylib mode-444) breaks
    // the copy; drop it so the copy recreates it fresh.
    final File stale = file("${macAppInput.get().asFile}/angle/libMoltenVK.dylib")
    if(stale.isFile() && !stale.canWrite()) {
      stale.delete()
    }
  }
  into macAppInput

  // Everything from the upstream dist except the vanilla jar — the main
  // jar is this project's transformed build.
  from(rootProject.layout.buildDirectory.dir('libs')) {
    include '*.jar', 'log4j2-updater.xml'
    exclude 'lod-game-snapshot.jar'
  }
  from(layout.buildDirectory.dir('libs')) { include 'lod-game-snapshot.jar' }
  into('libs') { from(rootProject.layout.buildDirectory.dir('libs/libs')) }
  into('gfx') {
    from(rootProject.layout.projectDirectory.dir('gfx')) {
      exclude 'textures/noslop.png', 'textures/icon.png'
    }
    // Generated copyright font atlas (TTF rasterised by :generateCopyrightFont)
    from rootProject.layout.buildDirectory.dir('generated-gfx')
    // macOS port branding: upstream's "no slop" badge slot carries the
    // Devin logo instead (same quad/position as Android's staging), and
    // upstream's 16px window icon becomes the Dart icon so the runtime
    // setWindowIcon call matches the bundle icns.
    from(layout.projectDirectory.dir('branding')) {
      include 'noslop.png'
      include 'icon.png'
      into 'textures'
    }
  }
  into('patches') { from rootProject.layout.projectDirectory.dir('patches') }
  into('lang') {
    from rootProject.layout.projectDirectory.dir('lang')
    filesMatching('unpacker.en.lang') {
      filter { line ->
        if(line.startsWith('unpacker.made_by_humans=')) {
          return 'unpacker.made_by_humans=macOS port\\nbuilt with'
        }
        return line
      }
    }
  }
  // Built-in mod assets (stat tables, portraits) read via Path.of("mods/...").
  // Contents/app/mods is symlinked to the user mods dir by BundleMain, so the
  // assets stage under builtin-mods/ and BundleMain merge-copies them into
  // ~/Documents/Severed Chains/mods at launch (mirrors the Android assets).
  into('builtin-mods') {
    from(rootProject.layout.projectDirectory.dir('third_party/sc-dragoon-modifier/mods'))
    from(rootProject.layout.projectDirectory.dir('third_party/icon-turn-order/mods'))
    from(rootProject.layout.projectDirectory.dir('third_party/lloyd_mod/mods'))
    from(rootProject.layout.projectDirectory.dir('own_mods/stardust_indicator/mods'))
  }
  from(rootProject.layout.projectDirectory) {
    include 'log4j2.xml', 'gamecontrollerdb.txt', 'launch.conf'
    filesMatching('log4j2.xml') { f -> f.filter(rewriteLog4jLine) }
  }
  doLast {
    checkLog4jConfig(file("${macAppInput.get().asFile}/log4j2.xml"))
    if(!file("${macAppInput.get().asFile}/lang/unpacker.en.lang").text.contains('built with')) {
      throw new GradleException('unpacker.en.lang no longer contains the made_by_humans key; update the staging transform')
    }
    // Geometry-shader-free TMD vertex shaders — MoltenVK reports
    // gl_MaxGeometryOutputVertices == 0 so tmd.gsh can never compile under
    // ANGLE-on-Metal/Vulkan. GlesApi swaps these in when geometryShaders
    // is false. The variant feeds the fragment stage directly (VS_OUT
    // renamed to the FS's GS_OUT) and emulates the geometry stage — cull
    // the face if any vert is too close to the camera, and average clip z
    // for PS1-depth faces — using sibling positions in attribs 7-9.
    ['tmd', 'battle_tmd'].each { base ->
      final File vshFile = file("${macAppInput.get().asFile}/gfx/shaders/${base}.vsh")
      String vsh = vshFile.getText('UTF-8')
      final Map<String, String> edits = [
        'layout(location = 6) in float inFlags;':
          'layout(location = 6) in float inFlags;\nlayout(location = 7) in vec3 inSibPos0;\nlayout(location = 8) in vec3 inSibPos1;\nlayout(location = 9) in vec3 inSibPos2;',
        'out VS_OUT {': 'out GS_OUT {',
        '  smooth float viewspaceZ;\n': '',
        'uniform float modelIndex;': 'uniform float modelIndex;\nuniform int usePs1Depth;',
        '  gl_Position = camera * t.model * pos;\n  vs_out.viewspaceZ = gl_Position.z;':
          '  mat4 camModel = camera * t.model;\n  gl_Position = camModel * pos;\n  float viewZSelf = gl_Position.z;',
        '  vs_out.depth = gl_Position.z;\n}':
          '''  vs_out.depth = gl_Position.z;

  // Emulated tmd.gsh — no geometry stage on this backend. The sibling
  // model-space positions in attribs 7-9 make the face cull and the
  // PS1-depth averaging (which need all of the face's verts) possible.
  int faceVertCount = (vs_out.vertFlags & 0x10) != 0 ? 4 : 3;
  float nearZ = viewZSelf;
  float clipSum = vs_out.depth;

  for(int i = 0; i < faceVertCount - 1; i++) {
    vec3 sibPos = i == 0 ? inSibPos0 : i == 1 ? inSibPos1 : inSibPos2;
    vec4 sib = camModel * vec4(sibPos, 1.0f);
    nearZ = min(nearZ, sib.z);

    if(projectionMode == 1) {
      float z = clamp(sib.z, 0.0, 65536.0);
      if(z != 0.0) {
        sib.xy *= zfar / z;
      }
    }

    if(projectionMode != 2 && t.screenOffset.z != 0.0f) {
      sib.z += t.screenOffset.z;
    }

    sib.xy += t.screenOffset.xy;
    clipSum += (projection * sib).z;
  }

  if(zfar >= nearZ * 2.0f) {
    // Whole face culled — emit a clipped position.
    gl_Position = vec4(0.0f, 0.0f, 2.0f, 1.0f);
  } else if(usePs1Depth != 0) {
    gl_Position.z = clipSum / faceVertCount;
  }
}''',
      ]
      for(final Map.Entry<String, String> e : edits.entrySet()) {
        if(!vsh.contains(e.key)) {
          throw new GradleException("_es.vsh generation missed ${base}.vsh: '${e.key.take(80)}' (upstream shader changed; update macos staging)")
        }
        vsh = vsh.replace(e.key, e.value)
      }
      file("${macAppInput.get().asFile}/gfx/shaders/${base}_es.vsh").text = vsh
    }
    // @loader_path rpath so dlopen("libMoltenVK.dylib") in ANGLE's Vulkan
    // loader resolves the bundled copy next to the ANGLE dylibs.
    ['libEGL.dylib', 'libGLESv2.dylib', 'libEGL_vulkan_secondaries.dylib', 'libGLESv2_vulkan_secondaries.dylib'].each { lib ->
      final File f = file("${macAppInput.get().asFile}/angle/${lib}")
      if(f.isFile() && !['otool', '-l', f.absolutePath].execute().text.contains('@loader_path')) {
        ['install_name_tool', '-add_rpath', '@loader_path', f.absolutePath].execute().waitForProcessOutput(System.out, System.err)
      }
    }
    // ICD manifest for ANGLE's statically-linked Khronos Vulkan loader;
    // library_path is relative to this file. BundleMain sets VK_ICD_FILENAMES.
    final File libMvk = file("${macAppInput.get().asFile}/angle/libMoltenVK.dylib")
    if(libMvk.isFile()) {
      // Brew ships the dylib read-only; writable so later builds can overwrite.
      libMvk.setWritable(true)
      final File icdDir = file("${macAppInput.get().asFile}/angle/icd")
      icdDir.mkdirs()
      file("${icdDir}/MoltenVK_icd.json").text = '''{
    "file_format_version" : "1.0.0",
    "ICD": {
        "library_path": "../libMoltenVK.dylib",
        "api_version" : "1.4.0",
        "is_portability_driver" : true
    }
}
'''
    }
  }

  def angleDir = file(angleLibsDir.get())
  if(angleDir.isDirectory()) {
    into('angle') {
      // The Vulkan backend lives in the *_vulkan_secondaries dylibs; the main
      // libGLESv2 dlopens them on demand when the Vulkan platform is chosen.
      from(angleDir) {
        include 'libEGL.dylib', 'libGLESv2.dylib',
          'libEGL_vulkan_secondaries.dylib', 'libGLESv2_vulkan_secondaries.dylib'
      }
      // ANGLE's Vulkan path dlopens libMoltenVK.dylib (Vulkan -> Metal layer).
      def moltenVk = ['/opt/homebrew/lib/libMoltenVK.dylib', '/usr/local/lib/libMoltenVK.dylib']
        .collect { file(it) }.find { it.isFile() }
      if(moltenVk != null) {
        from(moltenVk.parentFile) { include 'libMoltenVK.dylib' }
      }
    }
  } else {
    logger.warn("ANGLE libs not found at ${angleDir} — building OpenGL-only bundle")
  }
}

tasks.register('appIcon', Exec) {
  def iconset = layout.buildDirectory.dir('macapp/icon.iconset')
  def iconSrc = layout.projectDirectory.file('branding/icon.png')
  inputs.file iconSrc
  outputs.file macAppIcon

  doFirst {
    delete iconset
  }
  commandLine 'bash', '-c', """
    set -e
    SRC="${iconSrc.asFile.absolutePath}"
    DIR="${iconset.get().asFile.absolutePath}"
    mkdir -p "\$DIR"
    for spec in "16 icon_16x16.png" "32 icon_16x16@2x.png" "32 icon_32x32.png" "64 icon_32x32@2x.png" "128 icon_128x128.png" "256 icon_128x128@2x.png" "256 icon_256x256.png" "512 icon_256x256@2x.png" "512 icon_512x512.png" "1024 icon_512x512@2x.png"; do
      set -- \$spec
      sips -z "\$1" "\$1" "\$SRC" --out "\$DIR/\$2" >/dev/null
    done
    iconutil -c icns "\$DIR" -o "${macAppIcon.get().asFile.absolutePath}"
  """
}

tasks.register('packageMacApp', Exec) {
  dependsOn 'appInput', 'appIcon'
  def mainJar = 'lod-game-snapshot.jar'

  inputs.dir macAppInput
  inputs.file macAppIcon
  outputs.dir macDistDir

  doFirst {
    delete file("${macDistDir.get().asFile}/Severed Chains.app")
  }

  commandLine macJdkHome.get() + '/bin/jpackage',
    '--type', 'app-image',
    '--name', 'Severed Chains',
    '--app-version', macAppVersion.get(),
    '--vendor', 'Legend of Dragoon Modding',
    '--copyright', 'Severed Chains contributors',
    '--mac-package-identifier', 'org.legendofdragoon.severedchains',
    '--input', macAppInput.get().asFile.absolutePath,
    '--icon', macAppIcon.get().asFile.absolutePath,
    '--main-jar', mainJar,
    '--main-class', 'legend.game.macos.BundleMain',
    '--runtime-image', macJdkHome.get(),
    // Cwd determines where the game reads gfx/ and writes isos/saves/mods —
    // BundleMain chdirs into ~/Documents/Severed Chains at startup so no
    // writable path ever lands inside the signed bundle. (user.dir can't
    // express a per-user home path and JDK 25 ignores it for resolution
    // anyway, so there is no -Duser.dir option here.)
    // Bind LWJGL's GLES module to the bundled ANGLE lib before anything can
    // resolve the system libGL — must be a JVM property, not runtime config.
    '--java-options', '-Dorg.lwjgl.opengles.libname=$APPDIR/angle/libGLESv2.dylib',
    '--java-options', '-XstartOnFirstThread',
    '--java-options', '-Djoml.fastmath',
    '--java-options', '-Djoml.sinLookup',
    '--java-options', '-Djoml.useMathFma',
    '--java-options', '--add-opens java.base/java.util=ALL-UNNAMED',
    '--java-options', '--add-exports java.base/jdk.internal.misc=ALL-UNNAMED',
    '--java-options', '--enable-native-access=ALL-UNNAMED',
    '--java-options', '-Xmx2G',
    // Version + crash-relay config for GameLog/CrashReporter (mirrors the
    // Android manifest meta-data). Empty relay disables uploads.
    '--java-options', '-Dsc.version=' + macDisplayVersion.get(),
    '--java-options', '-Dsc.crash_relay_url=' + (project.findProperty('crashRelayUrl') ?: ''),
    '--java-options', '-Dsc.crash_relay_key=' + (project.findProperty('crashRelayKey') ?: ''),
    '--dest', macDistDir.get().asFile.absolutePath
}

tasks.register('patchMacAppPlist', Exec) {
  dependsOn 'packageMacApp'
  def app = file("${macDistDir.get().asFile}/Severed Chains.app")

  // jpackage generates a bare Info.plist; TCC needs usage-description keys
  // or macOS silently denies access to ~/Documents (data dir) and
  // /Volumes/Storage-style removable volumes (real file storage).
  commandLine '/bin/sh', '-c', """
    PLIST='${app.absolutePath}/Contents/Info.plist'
    PB=/usr/libexec/PlistBuddy
    "\$PB" -c "Add :NSRemovableVolumesUsageDescription string 'Severed Chains reads game data stored on an external volume.'" "\$PLIST" \
      || "\$PB" -c "Set :NSRemovableVolumesUsageDescription 'Severed Chains reads game data stored on an external volume.'" "\$PLIST"
    "\$PB" -c "Add :NSDocumentsFolderUsageDescription string 'Severed Chains stores saves, mods, settings and disc images in your Documents folder.'" "\$PLIST" \
      || "\$PB" -c "Set :NSDocumentsFolderUsageDescription 'Severed Chains stores saves, mods, settings and disc images in your Documents folder.'" "\$PLIST"
  """
}

// Notarization scans inside jars, and the x86_64 LWJGL natives ship
// unsigned dylibs — extract, sign with the same identity + secure
// timestamp, and update the jar entries before the bundle is signed.
// The bundled ANGLE/MoltenVK dylibs are adhoc-signed and get the same
// treatment since codesign --deep only reaches standard bundle paths.
tasks.register('signMacNatives', Exec) {
  dependsOn 'patchMacAppPlist'
  def appDir = file("${macDistDir.get().asFile}/Severed Chains.app/Contents/app")
  def libs = file("${appDir.absolutePath}/libs")
  def stage = layout.buildDirectory.dir('native-jar-sign')
  inputs.dir appDir
  onlyIf { libs.isDirectory() }
  onlyIf {
    def out = providers.exec {
      commandLine 'security', 'find-identity', '-v', '-p', 'codesigning'
      ignoreExitValue = true
    }
    out.standardOutput.asText.get().contains(macSignIdentity.get())
  }
  doFirst {
    def stageDir = stage.get().asFile
    delete stageDir
    stageDir.mkdirs()
  }
  commandLine '/bin/sh', '-c', """
    set -e
    for jar in "${libs.absolutePath}"/*-natives-macos*.jar; do
      [ -e "\$jar" ] || continue
      find "${stage.get().asFile}" -mindepth 1 -delete
      unzip -o -q "\$jar" '*.dylib' -d "${stage.get().asFile}" || true
      find "${stage.get().asFile}" -name '*.dylib' | while read -r d; do
        codesign --force --timestamp --options runtime --sign '${macSignIdentity.get()}' "\$d"
      done
      (cd "${stage.get().asFile}" && jar uf "\$jar" .)
    done
    find "${appDir.absolutePath}" -type f \\( -name '*.dylib' -o -name '*.jnilib' \\) | while read -r d; do
      codesign --force --timestamp --options runtime --sign '${macSignIdentity.get()}' "\$d"
    done
  """
}

tasks.register('signMacApp', Exec) {
  dependsOn 'patchMacAppPlist'
  dependsOn 'signMacNatives'
  def app = file("${macDistDir.get().asFile}/Severed Chains.app")

  // Only run when the identity exists in the keychain (unsigned local
  // builds still work by skipping this task or passing -PmacSignIdentity).
  onlyIf {
    def out = providers.exec {
      commandLine 'security', 'find-identity', '-v', '-p', 'codesigning'
      ignoreExitValue = true
    }
    def found = out.standardOutput.asText.get().contains(macSignIdentity.get())
    if(!found) {
      logger.lifecycle("Signing identity '${macSignIdentity.get()}' not in keychain — bundle stays unsigned")
    }
    found
  }

  doFirst {
    macEntitlements.get().asFile.text = '''<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0"><dict>
  <key>com.apple.security.cs.allow-jit</key><true/>
  <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
  <key>com.apple.security.cs.disable-library-validation</key><true/>
</dict></plist>
'''
  }

  commandLine 'codesign', '--deep', '--force', '--timestamp', '--options', 'runtime',
    '--entitlements', macEntitlements.get().asFile.absolutePath,
    '--sign', macSignIdentity.get(), app.absolutePath
}

tasks.register('verifyMacApp', Exec) {
  dependsOn 'signMacApp'
  def app = file("${macDistDir.get().asFile}/Severed Chains.app")
  onlyIf { tasks.named('signMacApp').get().state.executed }
  commandLine 'codesign', '--verify', '--deep', '--strict', '--verbose=2', app.absolutePath
}

// Stages the signed (or unsigned) .app plus an Applications symlink into a
// compressed UDZO disk image at macos/build/dist/Severed Chains.dmg.
tasks.register('packageMacDmg', Exec) {
  dependsOn 'signMacApp'
  def app = file("${macDistDir.get().asFile}/Severed Chains.app")
  def stage = layout.buildDirectory.dir('dmg-stage')
  def dmg = macDistDir.map { it.file('Severed Chains.dmg') }
  inputs.dir app
  outputs.file dmg
  doFirst {
    def stageDir = stage.get().asFile
    delete stageDir, dmg.get().asFile
    copy {
      // 'from app' would copy Contents/ loose; include keeps the .app dir.
      from app.parentFile
      include 'Severed Chains.app/**'
      into stageDir
    }
    java.nio.file.Files.createSymbolicLink(
      new File(stageDir, 'Applications').toPath(),
      new File('/Applications').toPath())
  }
  commandLine 'hdiutil', 'create', '-volname', 'Severed Chains',
    '-srcfolder', stage.get().asFile.absolutePath,
    '-ov', '-format', 'UDZO', dmg.get().asFile.absolutePath
}
