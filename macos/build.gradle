// macOS in-tree build: stages the shared upstream sources, applies
// literal transforms for macOS-specific behaviour, compiles them together
// with glue under macos/src/main/java, and packages a signed .app via
// jpackage. Mirrors the android/ subproject so upstream src/main/java
// stays untouched.

plugins {
  id 'java'
}

java {
  sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

def sharedSourceRoots = [
  'src/main/java',
  'third_party/sc-dragoon-modifier/src/main/java',
  'third_party/Additional-Additions/src/main/java',
  'third_party/icon-turn-order/src/main/java',
  'third_party/lloyd_mod/src/main/java',
  'own_mods/stardust_indicator/src/main/java',
  'own_mods/savepoint_heal/src/main/java',
]
def sharedResourceRoots = sharedSourceRoots.collect { it.replace('/java', '/resources') }

// ------------------------------------------------------------------
// Staged-source transforms. Keys are paths relative to the staged root;
// a literal that stops matching fails the build so upstream changes are
// never silently dropped. Do not duplicate file keys — entries overwrite.
// ------------------------------------------------------------------
// App version: -PmacAppVersion=x.y.z overrides; default derives from the git
// tag. macDisplayVersion is what the game shows (matches the Android
// versionName stamping); macAppVersion feeds jpackage's --app-version, which
// rejects a zero or negative major, so upstream 0.x.y tags map to 1.x.y for
// bundle metadata only.
def macTagVersion = providers.exec {
  commandLine 'git', 'describe', '--tags', '--abbrev=0'
  workingDir rootDir
  ignoreExitValue = true
}.standardOutput.asText.map { v -> v.trim() - ~/^v/ }
def macDisplayVersion = providers.gradleProperty('macAppVersion').orElse(macTagVersion.map { it.isEmpty() ? '1.0.0' : it })
def macAppVersion = providers.gradleProperty('macAppVersion').orElse(macTagVersion.map { v ->
  def m = (v =~ /^(\d+)\.(\d+)(\.(\d+))?/)
  if(!m.find()) {
    return '1.0.0'
  }
  def major = m.group(1).toInteger()
  def minor = m.group(2).toInteger()
  def patch = m.group(4) ? m.group(4).toInteger() : 0
  "${major == 0 ? 1 : major}.${minor}.${patch}"
})

