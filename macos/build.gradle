def stagedUnpatched = layout.buildDirectory.dir('shared-sources-unpatched')
def stagedSources = layout.buildDirectory.dir('shared-sources')

tasks.register('stageSharedSources', Sync) {
  sharedSourceRoots.each { from rootProject.layout.projectDirectory.dir(it) }
  into stagedUnpatched
}

tasks.register('patchSharedSources', Sync) {
  dependsOn 'stageSharedSources'
  from stagedUnpatched
  into stagedSources
  doLast {
    final File root = stagedSources.get().asFile

    final Collection<String> unstaged = sharedLiteralTransforms.keySet().findAll { !new File(root, it).isFile() }
    if(!unstaged.isEmpty()) {
      throw new GradleException("sharedLiteralTransforms names files that aren't staged: ${unstaged}")
    }

    root.eachFileRecurse { f ->
      if(!f.isFile() || !f.name.endsWith('.java')) {
        return
      }

      final String rel = root.toPath().relativize(f.toPath()).toString()
      String text = f.getText('UTF-8')
      final String original = text

      sharedLiteralTransforms[rel]?.each { literal, replacement ->
        // Idempotency first: additive transforms keep the needle inside the
        // replacement (e.g. Resolution rungs), so check the replacement is
        // absent before matching the needle, or re-runs double-apply.
        // An empty replacement (a deletion) is contained in every text, so it
        // can only be detected as done by its needle being gone.
        if(replacement.isEmpty() ? !text.contains(literal) && !text.contains(literal.replace('\n', '\r\n')) : text.contains(replacement) || text.contains(replacement.replace('\n', '\r\n'))) {
          return // already transformed by a previous run
        }
        // Upstream files mix LF and CRLF; match either newline style and
        // preserve the file's own style in the replacement.
        String needle = literal
        if(!text.contains(needle)) {
          needle = literal.replace('\n', '\r\n')
          if(!text.contains(needle)) {
            throw new GradleException("Staged-source transform missed ${rel}: '${literal.take(80)}' (upstream changed; update sharedLiteralTransforms)")
          }
        }
        text = text.replace(needle, needle.contains('\r\n') ? replacement.replace('\n', '\r\n') : replacement)
      }

      if(text != original) {
        f.setText(text, 'UTF-8')
      }
    }
  }
}

