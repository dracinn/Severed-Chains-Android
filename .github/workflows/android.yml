name: Android Build

on:
  push:
    branches:
    - main
    tags:
    - 'v*'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04

    steps:
    - name: Clone repo
      uses: actions/checkout@v5

    - name: Stamp version
      run: |
        sed -i "s/SNAPSHOT/${{ github.run_number }}/g" ./src/main/java/legend/core/Version.java
        sed -i "s/COMMIT/${{ github.sha }}/g" ./src/main/java/legend/core/Version.java
        sed -i "s/\"CHANNEL\"/\"ci\"/g" ./src/main/java/legend/core/Version.java
        sed -i "s/TIMESTAMP = null/TIMESTAMP = ZonedDateTime.parse(\"$(date --date='+5 minutes' -Iseconds -u)\")/g" ./src/main/java/legend/core/Version.java

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Install Android NDK
      run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"

    - name: Build debug APK
      run: ./gradlew :android:assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v5
      with:
        name: android-debug-apk
        path: android/build/outputs/apk/debug/android-debug.apk

  release:
    # Tags cut a real GitHub release; manual dispatch builds the signed APK
    # as an artifact only (handy for sideloading a release-signature build).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Clone repo
      uses: actions/checkout@v5

    - name: Stamp version
      run: |
        sed -i "s/SNAPSHOT/${{ github.run_number }}/g" ./src/main/java/legend/core/Version.java
        sed -i "s/COMMIT/${{ github.sha }}/g" ./src/main/java/legend/core/Version.java
        sed -i "s/\"CHANNEL\"/\"release\"/g" ./src/main/java/legend/core/Version.java
        sed -i "s/TIMESTAMP = null/TIMESTAMP = ZonedDateTime.parse(\"$(date --date='+5 minutes' -Iseconds -u)\")/g" ./src/main/java/legend/core/Version.java

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Install Android NDK
      run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"

    - name: Decode signing keystore
      env:
        SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
      run: echo "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"

    - name: Build signed release APK
      env:
        SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        ANDROID_VERSION_NAME: ${{ github.ref_name }}
      run: ./gradlew :android:assembleRelease

    - name: Upload signed APK
      uses: actions/upload-artifact@v5
      with:
        name: android-release-apk
        path: android/build/outputs/apk/release/android-release.apk

    - name: Create GitHub release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag="${GITHUB_REF_NAME}"
        gh release create "$tag" \
          android/build/outputs/apk/release/android-release.apk \
          --title "Severed Chains Android $tag" \
          --generate-notes
